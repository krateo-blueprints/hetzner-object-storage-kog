name: release-chart

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  HELM_VERSION: v3.16.2
  CHART_DIR: chart

jobs:
  lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint
        run: helm lint "$CHART_DIR"

      - name: helm template (smoke test)
        run: helm template test-release "$CHART_DIR" --namespace krateo-system > /dev/null

  release:
    name: package and push to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Verify git tag matches Chart.yaml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          chart_version="$(awk '/^version:/ {print $2; exit}' "$CHART_DIR/Chart.yaml")"
          if [ "$tag" != "$chart_version" ]; then
            echo "::error::Git tag v$tag does not match Chart.yaml version $chart_version"
            exit 1
          fi
          echo "Tag and chart version match: $tag"

      - name: helm package
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist
          ls -la dist

      - name: helm registry login (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: helm push to oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          set -euo pipefail
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done

      - name: Logout from GHCR
        if: always()
        run: helm registry logout ghcr.io || true
